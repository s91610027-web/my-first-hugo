baseURL = 'https://example.org/'
locale = 'zh-tw'
defaultContentLanguage = 'zh-tw'
title = '我的個人部落格'
theme = 'hugo-theme-stack'

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  mainSections = ["posts", "post"]
  description = "記錄技術筆記、學習心得與生活隨筆"
  keywords = ["Blog", "Tech", "Hugo", "Stack"]

  [params.sidebar]
    compact = false
    title = "我的個人部落格"
    subtitle = "記錄軟體開發與生活思緒的地方 👋"

  [params.article]
    toc = true
    readingTime = true
    headingAnchor = true

  [params.colorScheme]
    toggle = true
    default = "auto"

  [params.footer]
    since = 2026
    customText = "Powered by Hugo & Hugo Theme Stack"

# 主選單導覽
[[menu.main]]
  identifier = "posts"
  name = "文章彙整"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "categories"
  name = "分類"
  url = "/categories/"
  weight = 20

[[menu.main]]
  identifier = "tags"
  name = "標籤"
  url = "/tags/"
  weight = 30

[[menu.main]]
  identifier = "about"
  name = "關於我"
  url = "/about/"
  weight = 40
